[package]
name = "diru"
version = "0.1.0"
edition = "2021"

[lib]

[[bin]]
name = "diru"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "5.0.1"
sea-orm = { version = "0.12.15", features = ["sqlx-sqlite", "macros", "runtime-tokio", "runtime-tokio-rustls"] }
thiserror = "1.0.61"
tokio = { version = "1.37.0", features = ["full", "tracing"] }
tracing = { version = "0.1.40", features = ["log", "async-await"] }
tracing-subscriber = { version = "0.3.18", features = ["serde", "chrono", "tracing-serde", "env-filter"] }
